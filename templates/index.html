```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pixel</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="app">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="logo">
                <div class="logo-icon">P</div>
                <div>
                    <h1>PIXEL</h1>
                    <span>LOCAL AI</span>
                </div>
            </div>

            <div class="status">
                <span class="status-dot"></span>
                <span>ONLINE</span>
            </div>

            <div class="sidebar-section">
                <button id="clear-chat" class="sidebar-button">
                    <span>＋</span>
                    New Conversation
                </button>
            </div>

            <div class="sidebar-info">
                <div class="info-row">
                    <span>LLM</span>
                    <span>LM Studio</span>
                </div>

                <div class="info-row">
                    <span>TTS</span>
                    <span>Audio8</span>
                </div>

                <div class="info-row">
                    <span>VOICE</span>
                    <span>Pixel</span>
                </div>
            </div>

        </aside>


        <!-- MAIN CHAT -->
        <main class="chat-container">

            <!-- HEADER -->
            <header class="chat-header">

                <div class="character">

                    <div class="avatar">
                        P
                    </div>

                    <div class="character-info">
                        <h2>Pixel</h2>

                        <div class="online-status">
                            <span></span>
                            Ready to talk
                        </div>
                    </div>

                </div>

                <div class="header-controls">

                    <button id="mute-button" class="icon-button" title="Mute">
                        🔊
                    </button>

                    <button id="stop-button" class="icon-button" title="Stop speaking">
                        ■
                    </button>

                </div>

            </header>


            <!-- MESSAGES -->
            <section id="chat-messages" class="chat-messages">

                <div class="message pixel-message">

                    <div class="message-avatar">
                        P
                    </div>

                    <div class="message-content">

                        <div class="message-name">
                            Pixel
                        </div>

                        <div class="bubble">
                            Hah. You're finally here.
                            What do you want?
                        </div>

                    </div>

                </div>

            </section>


            <!-- TYPING INDICATOR -->
            <div id="typing-indicator" class="typing-indicator hidden">

                <div class="message-avatar">
                    P
                </div>

                <div class="typing-bubble">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

            </div>


            <!-- INPUT -->
            <footer class="input-area">

                <div class="input-container">

                    <textarea
                        id="message-input"
                        placeholder="Talk to Pixel..."
                        rows="1"
                    ></textarea>

                    <button id="send-button" class="send-button">
                        ➤
                    </button>

                </div>

                <div class="input-hint">
                    Press Enter to send • Shift + Enter for a new line
                </div>

            </footer>

        </main>

    </div>


    <script src="/static/app.js?v=2"></script>

</body>
</html>
```
